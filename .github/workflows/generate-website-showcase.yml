name: Generate website project showcase

on:
  push:
    paths:
      - '.github/workflows/generate-website-showcase.yml'
      - 'website_project_showcase_2026-09-08/_build/**'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reconstruct generator
        shell: bash
        run: |
          cat website_project_showcase_2026-09-08/_build/chunk_*.txt | base64 --decode | gzip --decompress > /tmp/generate_showcase.py
          python -m py_compile /tmp/generate_showcase.py

      - name: Generate 40 PNG explainers and handoff docs
        env:
          SHOWCASE_OUT: ${{ github.workspace }}/website_project_showcase_2026-09-08
        run: python /tmp/generate_showcase.py

      - name: Validate output
        shell: bash
        run: |
          test "$(find website_project_showcase_2026-09-08 -mindepth 2 -maxdepth 2 -name '*.png' | wc -l)" -eq 40
          for d in website_project_showcase_2026-09-08/0[1-8]_*; do
            test "$(find "$d" -maxdepth 1 -name '*.png' | wc -l)" -eq 5
            test -f "$d/README.md"
          done
          test -f website_project_showcase_2026-09-08/PROJECTS_SUMMARY.csv
          test -f website_project_showcase_2026-09-08/VERSION_BACKLOG.csv
          test -f website_project_showcase_2026-09-08/manifest.json

      - name: Remove temporary payload and commit final showcase
        shell: bash
        run: |
          rm -rf website_project_showcase_2026-09-08/_build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website_project_showcase_2026-09-08
          git commit -m 'docs(showcase): add 8-project interview UI explainer set'
          git pull --rebase origin main
          git push origin main
